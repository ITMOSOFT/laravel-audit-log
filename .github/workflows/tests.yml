name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 12
            testbench: '^10.0'
            phpunit: '^11.0'
          - laravel: 13
            testbench: '^11.0'
            phpunit: '^12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Configure test dependencies
        run: >
          composer require --dev
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"
          --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run tests
        run: composer test
